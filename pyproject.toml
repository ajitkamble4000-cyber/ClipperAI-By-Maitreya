[project]
name = "shorts-studio"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared/py", "api", "worker"]

[tool.uv.sources]
studio-shared = { workspace = true }
studio-api = { workspace = true }
studio-worker = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "httpx>=0.27", "studio-shared", "studio-api", "studio-worker"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["shared/py/tests", "api/tests", "worker/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs local Supabase + Redis + S3 (make dev-up)",
  "gemini: calls the real Gemini API (needs a key)",
  "slow: long media tests",
]
