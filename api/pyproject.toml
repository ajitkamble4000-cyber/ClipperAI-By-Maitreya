[project]
name = "studio-api"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "studio-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "celery[redis]>=5.4",
  "python-multipart>=0.0.12",
  "pydantic[email]>=2.14.3",
]

[tool.uv.sources]
studio-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
