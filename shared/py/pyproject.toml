[project]
name = "studio-shared"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "boto3>=1.35",
  "cryptography>=43",
  "google-genai>=1.0",
  "json-repair>=0.30",
  "redis>=5.2",
  "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_shared"]
