# Publishes the web app (static build) to GitHub Pages on every push to main.
# The API, workers and database run on your server; Pages only serves the website files.
#
# Where it publishes (see DEPLOY.md, "Web app on GitHub Pages"):
#   A) Default: the `gh-pages` branch of this repository.
#      If the site doesn't appear: Settings → Pages → Deploy from a branch → gh-pages / (root).
#   B) Keep THIS repository private: set variable PAGES_REPO = owner/name of a separate public repository
#      (e.g. you/you.github.io) and secret PAGES_DEPLOY_TOKEN = a fine-grained token with Contents: read & write
#      on it. Then in that repository: Settings → Pages → Deploy from a branch → main / (root).
# Optional variable PAGES_DOMAIN = your own domain (e.g. app.example.com) once it's set up in Settings → Pages.
# Server addresses (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_API_URL
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write # to update the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: base
        name: Where the site will live
        env:
          PAGES_REPO: ${{ vars.PAGES_REPO }}
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$PAGES_DOMAIN" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          elif [ -n "$PAGES_REPO" ]; then
            name="${PAGES_REPO#*/}"
            case "$name" in *.github.io) echo "path=" >> "$GITHUB_OUTPUT" ;; *) echo "path=/$name" >> "$GITHUB_OUTPUT" ;; esac
          else
            echo "path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_TELEMETRY_DISABLED: "1"
          V_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          V_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          V_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          # Repository variables win; otherwise the public values in web/.env.production are used.
          if [ -n "$V_SUPABASE_URL" ]; then export NEXT_PUBLIC_SUPABASE_URL="$V_SUPABASE_URL"; fi
          if [ -n "$V_SUPABASE_ANON_KEY" ]; then export NEXT_PUBLIC_SUPABASE_ANON_KEY="$V_SUPABASE_ANON_KEY"; fi
          if [ -n "$V_API_URL" ]; then export NEXT_PUBLIC_API_URL="$V_API_URL"; fi
          npx next build
      - name: Prepare files
        env:
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: |
          touch out/.nojekyll
          if [ -n "$PAGES_DOMAIN" ]; then echo "$PAGES_DOMAIN" > out/CNAME; fi
          printf 'Built website files of ClipperAI by Maitreya. All rights reserved.\n' > out/README.md
      - name: Publish
        env:
          TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          PAGES_REPO: ${{ vars.PAGES_REPO }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          if [ -n "$PAGES_REPO" ]; then
            if [ -z "$TOKEN" ]; then echo "::error::Add the PAGES_DEPLOY_TOKEN secret (see the top of this file)"; exit 1; fi
            git push -qf "https://x-access-token:${TOKEN}@github.com/${PAGES_REPO}.git" main
            echo "::notice::Published to https://github.com/${PAGES_REPO}"
          else
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main:gh-pages
            echo "::notice::Published to the gh-pages branch. If the site isn't live: Settings → Pages → Deploy from a branch → gh-pages."
          fi
