# Publishes the web app (static build) to GitHub Pages on every push to main.
# The API, workers and database run on your server; Pages only serves the website files.
#
# Two ways to publish (see DEPLOY.md, "Web app on GitHub Pages"):
#   A) This repository is public: Settings → Pages → Source: GitHub Actions.
#   B) Keep THIS repository private: only the built website goes to a separate public repository.
#      Variable PAGES_REPO = owner/name of that repository (e.g. you/you.github.io),
#      secret PAGES_DEPLOY_TOKEN = a fine-grained token with Contents: read & write on it.
#      Then in that repository: Settings → Pages → Deploy from a branch → main / (root).
# Server addresses (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_API_URL
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        if: vars.PAGES_REPO == ''
        uses: actions/configure-pages@v5
        continue-on-error: true # Pages not switched on yet: still build (as a check), skip publishing
      - if: vars.PAGES_REPO == '' && steps.pages.outcome != 'success'
        run: echo "::warning title=GitHub Pages is off::Turn it on in Settings → Pages → Source → GitHub Actions (or set PAGES_REPO, see the top of this file), then re-run this workflow. The site was built but not published."
      - id: base
        name: Where the site will live
        env:
          PAGES_REPO: ${{ vars.PAGES_REPO }}
          FROM_PAGES: ${{ steps.pages.outputs.base_path }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$PAGES_REPO" ]; then
            name="${PAGES_REPO#*/}"
            case "$name" in *.github.io) echo "path=" >> "$GITHUB_OUTPUT" ;; *) echo "path=/$name" >> "$GITHUB_OUTPUT" ;; esac
          elif [ -n "$FROM_PAGES" ]; then
            echo "path=$FROM_PAGES" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - name: Build static site
        run: npx next build
        env:
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_TELEMETRY_DISABLED: "1"
      - run: touch out/.nojekyll
      - if: vars.PAGES_REPO == '' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - name: Publish to the website repository (source stays private)
        if: vars.PAGES_REPO != ''
        env:
          TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          PAGES_REPO: ${{ vars.PAGES_REPO }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Add the PAGES_DEPLOY_TOKEN secret (see the top of this file)"; exit 1; fi
          cd out
          printf 'Built website files only. All rights reserved; see the source owner.\n' > README.md
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${PAGES_REPO}.git" main
          echo "::notice::Published to https://github.com/${PAGES_REPO}"

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
